[workspace]
members = ["rust/kernel"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LGPL-2.1-only WITH OCCT-exception-1.0"
repository = "https://github.com/jackControls/rustyOCCT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# R13: the library denies the platform's libm (rust/kernel/clippy.toml and
# lib.rs); tests and examples may call it.
disallowed_methods = "allow"
