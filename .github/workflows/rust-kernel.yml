name: Rust kernel

on:
  push:
    branches: [rust-kernel]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', 'tests/**', 'resources/DrawResources/**', '.github/workflows/rust-kernel.yml']
  pull_request:
    branches: [rust-kernel]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', 'tests/**', 'resources/DrawResources/**', '.github/workflows/rust-kernel.yml']
  # Nightly: every job in full, Windows included (REVIEW_NOTES U6).
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-draw:
    name: Original OCCT tests / Rust and native
    runs-on: ubuntu-24.04
    # The fixture generators' checks run in their own job (fixture-generators
    # below); the bridge tests (10 minutes), the upstream runs on both
    # kernels (28 minutes with S9's registered Booleans) and the native
    # comparisons remain.
    timeout-minutes: 60
    env:
      CSF_OCCTResourcePath: /usr/share/opencascade/resources
      DRAWHOME: /usr/share/opencascade/resources/DrawResources
      CSF_DrawPluginDefaults: /usr/share/opencascade/resources/DrawResources
      DRAWDEFAULT: /usr/share/opencascade/resources/DrawResources/DrawDefault
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install test interpreters
        run: |
          sudo apt-get update
          # DRAW loads plugins by unversioned .so names supplied by the dev package.
          sudo apt-get install --no-install-recommends -y tcl occt-draw occt-misc libocct-draw-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev python3-venv
      - name: Install independent polynomial oracle
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Test the bridge, including deliberate failures
        env:
          RUSTY_TEST_DRAW_EXE: /usr/bin/occt-draw
        run: target/math-oracle-venv/bin/python -m unittest discover -s rust/tools -p 'test_*.py' -v
      - name: Run unchanged upstream tests on both kernels
        run: python3 rust/tools/run_upstream_tests.py --backend both --draw-exe /usr/bin/occt-draw
      - name: Compare line and plane intersections with native OCCT
        run: python3 rust/tools/compare_intersections.py --occt-root /usr
      - name: Compare certified closest points and minimum distances with OCCT
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_proximity.py --occt-root /usr
      - name: Compare complete linear intersection sets with native COMMON and SECTION
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_linear_sets.py --occt-root /usr
      - name: Compare polynomial roots and curved intersections with native OCCT
        run: python3 rust/tools/compare_curved.py --occt-root /usr
      - name: Compare spline positions and derivatives with native OCCT
        run: python3 rust/tools/compare_splines.py --occt-root /usr
      - name: Compare surface partial derivatives with native OCCT
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_surfaces.py --occt-root /usr
      - name: Compare exact Bezier extraction and editing with native OCCT
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_bezier_editing.py --occt-root /usr
      - name: Compare exact tensor patches and isocurves with native OCCT
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_surface_editing.py --occt-root /usr
      - name: Compare exact knot refinement and removal with native OCCT
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_knot_editing.py --occt-root /usr
      - name: Compare complete surface knot grids and removal decisions with native OCCT
        if: ${{ !cancelled() }}
        run: python3 rust/tools/compare_surface_knots.py --occt-root /usr
      - name: Compare spline-plane intersections with native OCCT and exact mathematics
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_spline_plane.py --occt-root /usr
      - name: Compare spline-sphere and spline-cylinder intersections
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_spline_quadric.py --occt-root /usr
      - name: Preserve logs and explicit coverage results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: upstream-draw-results
          path: |
            target/upstream-tests/
            target/intersection-oracle/
            target/proximity-oracle/
            target/linear-sets-oracle/
            target/curved-oracle/
            target/spline-oracle/
            target/surface-oracle/
            target/bezier-editing-oracle/
            target/surface-editing-oracle/
            target/knot-editing-oracle/
            target/surface-knot-oracle/
            target/spline-plane-oracle/
            target/spline-quadric-oracle/
          if-no-files-found: warn

  fixture-generators:
    name: Fixture generators / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    # Split from the upstream job (S9d): its 40 minutes no longer covered
    # the generators' checks (31 minutes) beside the bridge tests. The cones'
    # reference alone took 31 minutes on a loaded host.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [algebra, brep, booleans, cones, cones-loops, tori, torus-parts, chained, spline-any, given,
                given-curved, given-met, spline-parallel, spline-crossing, imported]
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install independent polynomial oracle
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Verify the independent exact arithmetic oracle - predicates, curves and splines
        if: matrix.group == 'algebra'
        run: |
          python3 rust/tools/generate_predicate_fixtures.py --check
          python3 rust/tools/generate_spatial_fixtures.py --check
          python3 rust/tools/generate_proximity_fixtures.py --check
          python3 rust/tools/generate_linear_sets_fixtures.py --check
          python3 rust/tools/generate_curved_fixtures.py --check
          python3 rust/tools/generate_spline_fixtures.py --check
          python3 rust/tools/generate_bezier_editing_fixtures.py --check
          python3 rust/tools/generate_knot_editing_fixtures.py --check
          python3 rust/tools/generate_surface_knot_fixtures.py --check
          python3 rust/tools/generate_degree_elevation_fixtures.py --check
          python3 rust/tools/generate_exact_spline_intersection_fixtures.py --check
          python3 rust/tools/generate_surface_editing_fixtures.py --check
          python3 rust/tools/generate_surface_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_real_root_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_root_comparison_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_algebraic_image_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_spline_proximity_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_spline_plane_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_spline_quadric_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_closed_clip_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_affine_parameter_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_spline_linear_fixtures.py --check
      - name: Verify the independent exact arithmetic oracle - B-rep, history, intersections, splits and Booleans
        if: matrix.group == 'brep'
        run: |
          target/math-oracle-venv/bin/python rust/tools/generate_brep_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_identity_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_history_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_split_merge_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_attribute_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_brep_io_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_primitive_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_analytic_intersection_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_procedural_intersection_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_torus_curve_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_ruled_curve_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_curve_surface_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_curve_curve_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_split_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_polyhedral_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_curved_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_tessellation_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_step_fixtures.py --check
      - name: Verify the curved Booleans independent references (S9c-S9d)
        if: matrix.group == 'booleans'
        run: |
          target/math-oracle-venv/bin/python rust/tools/generate_procedural_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_turned_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_capped_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_sphere_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_spheres_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_spheres_turned_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_cone_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_torus_boolean_fixtures.py --check
          target/math-oracle-venv/bin/python rust/tools/generate_torus_segment_boolean_fixtures.py --check
      - name: Verify the cones' Boolean independent reference (S9d.3b)
        if: matrix.group == 'cones'
        run: target/math-oracle-venv/bin/python rust/tools/generate_cones_boolean_fixtures.py --check
      - name: Verify the cones' loops Boolean independent reference (S9d.3c)
        if: matrix.group == 'cones-loops'
        run: target/math-oracle-venv/bin/python rust/tools/generate_cones_loops_boolean_fixtures.py --check
      - name: Verify the tori's curved Boolean independent reference (S9d.4b.2)
        if: matrix.group == 'tori'
        run: target/math-oracle-venv/bin/python rust/tools/generate_torus_curved_boolean_fixtures.py --check
      - name: Verify the torus parts' and caps' Boolean independent reference (S9d.4c)
        if: matrix.group == 'torus-parts'
        run: target/math-oracle-venv/bin/python rust/tools/generate_torus_parts_boolean_fixtures.py --check
      - name: Verify the chained Boolean independent reference (S9e.1)
        if: matrix.group == 'chained'
        run: target/math-oracle-venv/bin/python rust/tools/generate_chained_boolean_fixtures.py --check
      - name: Verify the spline prisms' Boolean independent reference in any position (S9f.1)
        if: matrix.group == 'spline-any'
        run: target/math-oracle-venv/bin/python rust/tools/generate_spline_any_boolean_fixtures.py --check
      - name: Verify the given Boolean independent reference (S9e.2)
        if: matrix.group == 'given'
        run: target/math-oracle-venv/bin/python rust/tools/generate_given_boolean_fixtures.py --check
      - name: Verify the given curved Boolean independent reference (S9e.3a)
        if: matrix.group == 'given-curved'
        run: target/math-oracle-venv/bin/python rust/tools/generate_given_curved_boolean_fixtures.py --check --workers 4
      - name: Verify the given met Boolean independent reference (S9e.3b)
        if: matrix.group == 'given-met'
        run: target/math-oracle-venv/bin/python rust/tools/generate_given_met_boolean_fixtures.py --check --workers 4
      - name: Verify the spline prisms' Boolean independent reference with parallel walls (S9f.2a)
        if: matrix.group == 'spline-parallel'
        run: target/math-oracle-venv/bin/python rust/tools/generate_spline_parallel_boolean_fixtures.py --check --workers 4
      - name: Verify the spline prisms' Boolean independent reference with crossing walls (S9f.2b)
        if: matrix.group == 'spline-crossing'
        run: target/math-oracle-venv/bin/python rust/tools/generate_spline_crossing_boolean_fixtures.py --check --workers 4
      - name: Verify the imported solids' Boolean independent reference (S9e.4a)
        if: matrix.group == 'imported'
        run: target/math-oracle-venv/bin/python rust/tools/generate_imported_boolean_fixtures.py --check --workers 4

  pinned-degree-oracle:
    name: Degree elevation / source-pinned OCCT
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build only the headless geometry SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/degree-sdk --jobs 2
      - name: Compare every control against independent mathematics and native OCCT
        run: python3 rust/tools/compare_degree_elevation.py --occt-root target/degree-sdk/install --sdk-manifest target/degree-sdk/build-manifest.json
      - name: Preserve native observations, library provenance, and discrepancies
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-degree-results
          path: |
            target/degree-elevation-oracle/
            target/degree-sdk/build-manifest.json
            target/degree-sdk/*.log
            target/degree-sdk/build/CMakeCache.txt
            target/degree-sdk/build/compile_commands.json
          if-no-files-found: warn

  pinned-spline-proximity-oracle:
    name: Spline minimum distances / source-pinned OCCT
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install the independent exact polynomial oracle
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build the headless extrema SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/spline-proximity-sdk --toolkit TKGeomAlgo --jobs 2
      - name: Test deliberate bridge failures and certify every minimum
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_spline_proximity_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_spline_proximity.py --occt-root target/spline-proximity-sdk/install --sdk-manifest target/spline-proximity-sdk/build-manifest.json
      - name: Preserve source provenance, native observations, and differences
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-spline-proximity-results
          path: |
            target/spline-proximity-oracle/
            target/spline-proximity-sdk/build-manifest.json
            target/spline-proximity-sdk/*.log
            target/spline-proximity-sdk/build/CMakeCache.txt
            target/spline-proximity-sdk/build/compile_commands.json
          if-no-files-found: warn

  pinned-spline-linear-oracle:
    name: Spline/line intersections / source-pinned OCCT
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install the independent exact polynomial oracle
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build the headless edge/edge SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/spline-linear-sdk --toolkit TKBO --jobs 2
      - name: Test deliberate bridge failures and certify every preimage
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_spline_linear_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_spline_linear.py --occt-root target/spline-linear-sdk/install --sdk-manifest target/spline-linear-sdk/build-manifest.json
      - name: Preserve source provenance, native observations, and differences
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-spline-linear-results
          path: |
            target/spline-linear-oracle/
            target/spline-linear-sdk/build-manifest.json
            target/spline-linear-sdk/*.log
            target/spline-linear-sdk/build/CMakeCache.txt
            target/spline-linear-sdk/build/compile_commands.json
          if-no-files-found: warn

  pinned-brep-oracle:
    name: B-rep validation and .brep interop / source-pinned OCCT
    runs-on: ubuntu-24.04
    # Every comparison passed at 4d5d3d5b in 60 minutes 3 seconds: the
    # SDK build (15), the bridges (23) and the tessellations (9) grew.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install the independent reference validator's arithmetic
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build the headless BRepCheck and BRepMesh SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/brep-sdk --toolkit TKTopAlgo --toolkit TKMesh --toolkit TKBO --toolkit TKPrim --jobs 2
      - name: Test deliberate bridge failures and compare every analyzable case
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_brep_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_brep.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_brep.py --family spline --output target/spline-brep-oracle --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_brep.py --family sheet --output target/sheet-brep-oracle --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Test deliberate interop bridge failures and read back every written solid and free shape
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_brep_io_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_brep_io.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare analytic surface intersections with IntAna_QuadQuadGeo, GeomInt_IntSS and the exact references
        run: |
          target/math-oracle-venv/bin/python rust/tools/compare_analytic_intersections.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_procedural_intersections.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare a torus's traced curves with GeomInt_IntSS and the exact reference
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_torus_curves.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare two cones' traced curves with GeomInt_IntSS and the exact reference
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_ruled_curves.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare lines and circles against analytic surfaces with GeomAPI_IntCS and the exact reference
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_curve_surface.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare prisms split by planes with BRepAlgoAPI_Splitter and the quadrature reference
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_split.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare Booleans of two prisms with BRepAlgoAPI_Fuse, Cut and Common and the slicing reference
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_boolean.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Compare pairs of lines and conics with IntTools_EdgeEdge and the exact reference
        if: ${{ !cancelled() }}
        run: target/math-oracle-venv/bin/python rust/tools/compare_curve_curve.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Test the tessellation reference's deliberate failures and compare analytic and spline tessellations with BRepMesh_IncrementalMesh
        if: ${{ !cancelled() }}
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_tessellation_reference.py
          target/math-oracle-venv/bin/python rust/tools/compare_tessellation.py --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_tessellation.py --family spline --occt-root target/brep-sdk/install --sdk-manifest target/brep-sdk/build-manifest.json
      - name: Preserve source provenance, native observations, and differences
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-brep-results
          path: |
            target/brep-oracle/
            target/spline-brep-oracle/
            target/sheet-brep-oracle/
            target/brep-io-oracle/
            target/analytic-intersection-oracle/
            target/procedural-intersection-oracle/
            target/torus-curve-oracle/
            target/ruled-curve-oracle/
            target/curve-surface-oracle/
            target/curve-curve-oracle/
            target/split-oracle/
            target/boolean-oracle/
            target/tessellation-oracle/
            target/spline-tessellation-oracle/
            target/brep-sdk/build-manifest.json
            target/brep-sdk/*.log
            target/brep-sdk/build/CMakeCache.txt
            target/brep-sdk/build/compile_commands.json
          if-no-files-found: warn

  pinned-step-oracle:
    name: STEP import / source-pinned OCCT
    runs-on: ubuntu-24.04
    # TKDESTEP brings the data exchange, application framework and
    # visualisation toolkits into the pinned build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install the independent reference's arithmetic
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build the headless STEP reader SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/step-sdk --toolkit TKDESTEP --jobs 2
      - name: Compare the authored STEP files with STEPControl_Reader and the closed-form reference
        run: target/math-oracle-venv/bin/python rust/tools/compare_step.py --occt-root target/step-sdk/install --sdk-manifest target/step-sdk/build-manifest.json
      - name: Preserve source provenance, native observations, and differences
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-step-results
          path: |
            target/step-oracle/
            target/step-sdk/build-manifest.json
            target/step-sdk/*.log
            target/step-sdk/build/CMakeCache.txt
            target/step-sdk/build/compile_commands.json
          if-no-files-found: warn

  pinned-history-oracle:
    name: Extrusion and transform history / source-pinned OCCT
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install the independent reference's arithmetic
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build the headless prism SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/history-sdk --toolkit TKPrim --jobs 2
      - name: Test deliberate bridge failures and compare every captured history
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_history_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_history.py --occt-root target/history-sdk/install --sdk-manifest target/history-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_history.py --family arc --output target/history-arc-oracle --occt-root target/history-sdk/install --sdk-manifest target/history-sdk/build-manifest.json
      - name: Preserve source provenance, native observations, and differences
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-history-results
          path: |
            target/history-oracle/
            target/history-arc-oracle/
            target/history-sdk/build-manifest.json
            target/history-sdk/*.log
            target/history-sdk/build/CMakeCache.txt
            target/history-sdk/build/compile_commands.json
          if-no-files-found: warn

  pinned-split-merge-oracle:
    name: Height split and stacked fuse / source-pinned OCCT
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - name: Install the independent reference's arithmetic
        run: |
          python3 -m venv target/math-oracle-venv
          target/math-oracle-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r rust/tools/math-oracle-requirements.txt
      - name: Fetch the exact reference source
        run: git fetch --no-tags --depth=1 https://github.com/Open-Cascade-SAS/OCCT.git 3d097a0328e71b826377d4814ab05ec3c3d23871
      - name: Build the headless Boolean SDK with exception checks
        run: python3 rust/tools/build_pinned_occt.py --output target/split-merge-sdk --toolkit TKBO --toolkit TKPrim --jobs 2
      - name: Test deliberate bridge failures and compare every captured split and fuse
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_split_merge_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_split_merge.py --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
      - name: Test deliberate primitive bridge failures and compare every cone, sphere and torus with the reference
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_primitive_oracle.py
          target/math-oracle-venv/bin/python rust/tools/compare_primitives.py --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_primitives.py --family sphere --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_primitives.py --family torus --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
      - name: Test deliberate revolve history failures and compare cone, sphere and torus histories with MakeRevol
        if: ${{ !cancelled() }}
        run: |
          target/math-oracle-venv/bin/python rust/tools/test_revolve_history.py
          target/math-oracle-venv/bin/python rust/tools/compare_revolve_history.py --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_revolve_history.py --family sphere --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
          target/math-oracle-venv/bin/python rust/tools/compare_revolve_history.py --family torus --occt-root target/split-merge-sdk/install --sdk-manifest target/split-merge-sdk/build-manifest.json
      - name: Preserve source provenance, native observations, and differences
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-pinned-split-merge-results
          path: |
            target/split-merge-oracle/
            target/primitive-oracle/
            target/revolve-history-oracle/
            target/sphere-oracle/
            target/sphere-revolve-oracle/
            target/torus-oracle/
            target/torus-revolve-oracle/
            target/split-merge-sdk/build-manifest.json
            target/split-merge-sdk/*.log
            target/split-merge-sdk/build/CMakeCache.txt
            target/split-merge-sdk/build/compile_commands.json
          if-no-files-found: warn

  native:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # U6: per push, Windows runs a smoke subset (release library and the
      # modelling, validation and interop suites); the nightly schedule and
      # dispatches run everything.
      SMOKE: ${{ matrix.os == 'windows-latest' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - name: Windows smoke subset
        if: env.SMOKE == 'true'
        run: cargo +stable test --locked --release --lib --test modeling --test brep_validation --test occt_brep --test history_contracts
      - name: Record the pre-migration property baseline on this host
        # The committed baseline is a macOS/aarch64 observation; platform
        # trigonometry moves the last bits elsewhere. The T1 requirement is
        # that the migration changes no property on the same host, so the
        # revision before it writes this host's rows (its own comparison
        # against the macOS file then fails, which is expected here).
        if: matrix.os != 'macos-latest' && env.SMOKE != 'true'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 26fc457fea07f1e7db7590e3fb64a470c66ff435
          git worktree add pre-t1 FETCH_HEAD
          (cd pre-t1 && RUSTY_WRITE_PROPERTY_BASELINE=1 cargo +stable test --locked --release --test properties_baseline) || true
          # The rows were written by this run, not left from the checkout.
          test pre-t1/rust/fixtures/prism-properties-baseline.tsv -nt pre-t1/Cargo.toml
          echo "RUSTY_PROPERTY_BASELINE=../../pre-t1/rust/fixtures/prism-properties-baseline.tsv" >> "$GITHUB_ENV"
      - name: Test with debug assertions and overflow checks
        if: env.SMOKE != 'true'
        # The dev profile keeps its assertions and overflow checks; optimized,
        # since S9d's exact curved Booleans took hours unoptimized.
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '2'
        run: cargo +stable test --workspace --locked
      - if: env.SMOKE != 'true'
        run: cargo +stable test --workspace --locked --release
      - name: Verify every Bezier fixture with the second independent oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTY_VERIFY_ALL_BEZIER_ORACLES: '1'
        run: cargo +stable test --locked --release --test bezier_editing exact_controls_match_independent_polynomials_and_original_parameter_jets
      - name: Verify every tensor fixture with the second independent oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTY_VERIFY_ALL_SURFACE_ORACLES: '1'
        run: cargo +stable test --locked --release --test surface_editing complete_tensor_controls_and_independent_quotient_jets
      - name: Verify every knot edit with the second independent equation solver
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTY_VERIFY_ALL_KNOT_ORACLES: '1'
        run: cargo +stable test --locked --release --test knot_editing exact_controls_and_removal_decisions_match_independent_equations
      - name: Verify every surface knot edit with the second independent equation solver
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTY_VERIFY_ALL_SURFACE_KNOT_ORACLES: '1'
        run: cargo +stable test --locked --release --test surface_knots full_grids_and_removal_decisions_match_independent_equations
      - name: Reconstruct every degree-elevated control with the second independent solver
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTY_VERIFY_ALL_DEGREE_ORACLES: '1'
        run: cargo +stable test --locked --release --test degree_elevation
      - if: env.SMOKE != 'true'
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - if: env.SMOKE != 'true'
        run: cargo +stable run --locked --example plate

  wasm:
    name: WebAssembly library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - run: cargo +stable check --workspace --lib --locked --target wasm32-unknown-unknown

  minimum-rust:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test on the minimum Rust with debug assertions and overflow checks
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '2'
        run: cargo +1.85.0 test --workspace --locked
