name: Rust geometry fuzzing

on:
  push:
    branches: [rust-kernel]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', '.github/workflows/rust-fuzz.yml']
  pull_request:
    branches: [rust-kernel]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', '.github/workflows/rust-fuzz.yml']
  schedule:
    - cron: '23 6 * * *'
    # Weekly: minimise every retained corpus instead of fuzzing (REVIEW_NOTES R12).
    - cron: '41 2 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (1–3600)
        default: '600'
        required: true
      minimize:
        description: Minimise the retained corpora instead of fuzzing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geometry-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # At most 1h corpus startup (2h for surface_knots, REVIEW_NOTES R12) + 1h
    # requested mutation + final-batch grace.
    timeout-minutes: 195
    strategy:
      fail-fast: false
      matrix:
        target: [predicates, intersections, modeling, curved, splines, surfaces, roots, spline_intersections, proximity, linear_sets, bezier_editing, surface_editing, knot_editing, exact_spline_intersections, surface_knots, degree_elevation, spline_proximity, spline_linear, brep_validation, identity, history, split_merge, attributes, brep_io, analytic_intersections, tessellation, curve_surface, curve_curve, split]
    env:
      NIGHTLY: nightly-2026-09-22
      FUZZ_TARGET: ${{ matrix.target }}
      EVENT: ${{ github.event_name }}
      REQUESTED_SECONDS: ${{ inputs.seconds }}
      SCHEDULE: ${{ github.event.schedule }}
      MINIMIZE: ${{ inputs.minimize }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt
      - name: Cache fuzz runner
        id: runner
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.1-${{ runner.os }}-${{ runner.arch }}
      - if: steps.runner.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.1 --locked
      - run: cargo +"$NIGHTLY" fmt --manifest-path rust/fuzz/Cargo.toml --check
      - name: Restore evolving corpus
        uses: actions/cache/restore@v4.2.3
        with:
          path: rust/fuzz/corpus/${{ matrix.target }}
          key: corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: corpus-v1-${{ matrix.target }}-
      - name: Restore the last full replay's manifest
        uses: actions/cache/restore@v4.2.3
        with:
          path: rust/fuzz/corpus/${{ matrix.target }}.replayed
          key: replayed-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: replayed-v1-${{ matrix.target }}-
      - name: Run sanitizer and mathematical oracle campaign
        run: |
          if [ "$SCHEDULE" = '41 2 * * 0' ] || [ "$MINIMIZE" = true ]; then
            python3 rust/tools/run_fuzz.py --target "$FUZZ_TARGET" --toolchain "$NIGHTLY" --minimize
            exit
          fi
          if [ "$EVENT" = schedule ]; then
            python3 rust/tools/run_fuzz.py --target "$FUZZ_TARGET" --seconds 600 --toolchain "$NIGHTLY"
          elif [ "$EVENT" = workflow_dispatch ]; then
            python3 rust/tools/run_fuzz.py --target "$FUZZ_TARGET" --seconds "$REQUESTED_SECONDS" --toolchain "$NIGHTLY"
          else
            # U6: regressions, inputs new since the last full replay and a
            # sample seeded by the run id; schedule-only targets replay their
            # regressions only (FUZZING.md).
            python3 rust/tools/run_fuzz.py --target "$FUZZ_TARGET" --seconds 60 --toolchain "$NIGHTLY" \
              --per-push --sample-seed "$GITHUB_RUN_ID"
          fi
      - name: Preserve campaign evidence and reproducer inputs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/fuzz-reports/
            rust/fuzz/artifacts/${{ matrix.target }}/
            rust/fuzz/corpus/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: warn
      - name: Retain corpus for the next campaign
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4.2.3
        with:
          path: rust/fuzz/corpus/${{ matrix.target }}
          key: corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain the full replay's manifest
        if: always() && github.event_name != 'pull_request' && hashFiles(format('rust/fuzz/corpus/{0}.replayed', matrix.target)) != ''
        uses: actions/cache/save@v4.2.3
        with:
          path: rust/fuzz/corpus/${{ matrix.target }}.replayed
          key: replayed-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
