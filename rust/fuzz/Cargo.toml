[package]
name = "rusty-occt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[features]
# Requires cargo-fuzz --sanitizer address. This is test-harness-only FFI.
asan-allocator = []

[dependencies]
libfuzzer-sys = "=0.4.13"
num-bigint = "0.4.6"
num-rational = "0.4.2"
rusty-occt = { path = "../kernel" }

[workspace]
members = ["."]

[[bin]]
name = "proximity"
path = "fuzz_targets/proximity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "predicates"
path = "fuzz_targets/predicates.rs"
test = false
doc = false
bench = false

