[package]
name = "rusty-occt"
description = "A headless native Rust geometry kernel with explicit numerical contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Exact binary64 determinants and rational intersection constructions.
num-bigint = { version = "0.4.6", default-features = false }
# Exact rational spline evaluation, including derivatives at repeated knots.
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint"] }
# Binary integer gcd for exact polynomial content; already required by both.
num-integer = { version = "0.1.47", default-features = false }

[lints]
workspace = true
