# R13 (the review of 18 October 2026): kernel constructions never call the
# platform's libm, whose results differ between hosts in the last place. The
# library denies these (`lib.rs`); `cr.rs` has their correctly rounded
# counterparts (`x.sin_rn()` and so on). Tests and examples may use them.
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm; use cr::Rn::sin_rn" },
    { path = "f64::cos", reason = "platform libm; use cr::Rn::cos_rn" },
    { path = "f64::sin_cos", reason = "platform libm; use cr::Rn::sin_cos_rn" },
    { path = "f64::tan", reason = "platform libm; use cr::Rn::tan_rn" },
    { path = "f64::asin", reason = "platform libm; use cr::Rn::asin_rn" },
    { path = "f64::acos", reason = "platform libm; use cr::Rn::acos_rn" },
    { path = "f64::atan", reason = "platform libm; use cr::Rn::atan_rn" },
    { path = "f64::atan2", reason = "platform libm; use cr::Rn::atan2_rn" },
    { path = "f64::hypot", reason = "platform libm; use cr::Rn::hypot_rn" },
    { path = "f64::exp", reason = "platform libm; use cr::Rn::exp_rn" },
    { path = "f64::exp2", reason = "platform libm" },
    { path = "f64::exp_m1", reason = "platform libm" },
    { path = "f64::ln", reason = "platform libm; use cr::Rn::ln_rn" },
    { path = "f64::ln_1p", reason = "platform libm" },
    { path = "f64::log", reason = "platform libm" },
    { path = "f64::log2", reason = "platform libm; use cr::Rn::log2_rn" },
    { path = "f64::log10", reason = "platform libm" },
    { path = "f64::powf", reason = "platform libm" },
    { path = "f64::cbrt", reason = "platform libm" },
    { path = "f64::sinh", reason = "platform libm; use cr::Rn::sinh_rn" },
    { path = "f64::cosh", reason = "platform libm; use cr::Rn::cosh_rn" },
    { path = "f64::tanh", reason = "platform libm" },
    { path = "f64::asinh", reason = "platform libm; use cr::Rn::asinh_rn" },
    { path = "f64::acosh", reason = "platform libm" },
    { path = "f64::atanh", reason = "platform libm; use cr::Rn::atanh_rn" },
]
